<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Выберите свой продукт</title>
</head>
<body>
  <div class="container">
    <h1>Выберите свой продукт</h1>

    <!-- ПУНКТ 3: ШАБЛОН (скрыт) -->
    <template id="cardTemplate">
      <li class="card">
        <img class="card__image" src="" alt="" />
        <span class="card__purpose"></span>
        <h2 class="card__name"></h2>
        <p class="card__actions"></p>
        <span class="card__composition">Состав:</span>
        <ul class="card__ingredients"></ul>
        <span class="price">Цена</span>
        <span class="price__figure"></span>
      </li>
    </template>

    <!-- КОНТЕЙНЕР ДЛЯ КАРТОЧЕК -->
    <ul class="row" id="cardRow"></ul>
  </div>

  <button id="registerBtn">Регистрация</button>

  <div id="overlay" class="overlay"></div>

  <div id="modal" class="modal">
    <button id="closeModal" class="modal__close">✕</button>
    <h2>Регистрация</h2>
    <form id="registerForm">
      <label>Имя: <input type="text" id="firstName" name="firstName" required /></label>
      <label>Фамилия: <input type="text" id="lastName" name="lastName" required /></label>
      <label>Дата рождения: <input type="date" id="birthDate" name="birthDate" required /></label>
      <label>Логин: <input type="text" id="login" name="login" required /></label>
      <label>Пароль: <input type="password" id="password" name="password" required /></label>
      <label>Повтор пароля: <input type="password" id="confirmPassword" name="confirmPassword" required /></label>
      <button type="submit">Зарегистрироваться</button>
    </form>
  </div>

  <footer class="container__footer">
    <div class="footer-brand">
      <p class="NameCards">Product Cards</p>
      <p class="CardInfo">У нас самые лучшие продукты для кожи!</p>
      <div>
        <img src="telegaImg.png" class="telegaImg" alt="Telegram" />
        <img src="vkImg.png" class="vkImg" alt="VK" />
      </div>
    </div>

    <div class="footer-form">
      <form id="subscribeForm">
        <label class="subscribe" for="email">Подпишись на наши акции:</label>
        <div>
          <input type="email" id="email" placeholder="Введи Email..." required />
          <button class="SubscribeBut" type="submit">Подписаться</button>
        </div>
        <hr class="footer-divider" />
        <p>www.product-cards.com © all right reserve</p>
      </form>
    </div>

    <div class="footer-nav">
      <p class="fastHrefs">Быстрые ссылки</p>
      <nav>
        <ul>
          <li><a class="href1" href="#">Главная</a></li>
          <li><a class="href2" href="#">Магазин</a></li>
          <li><a class="href3" href="#">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <script src="homework-11.js"></script>
</body>
</html>
